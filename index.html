<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class 12</title>
<!-- Home-screen icon and full-screen mode (iPhone "Add to Home Screen", Android "Install") -->
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Class 12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5FAF6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,400;7..72,600&family=STIX+Two+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Same visual system as Therefore: one narrow column, levels list on home, stepwise exercises. */
:root{
  --paper:#F5FAF6; --surface:#FFFFFF; --ink:#14301F; --muted:#4F6B5A; --line:#D5E8DA;
  --accent:#1F7A4A; --accent-ink:#FFFFFF;
  --good:#1D7550; --good-tint:#E3F3EB; --bad:#B42318; --bad-bg:#FBE9E7;
  --soft:#EAF5EE;
  --blob1:#CDEFD8; --blob2:#E2F4C9; --blob3:#CFF0E6; --blob4:#F0F7D4; --lock-line:#CBE6D3; --lock-ring:rgba(76,175,110,.25); --lock-glow:rgba(31,122,74,.45); --lock-field:#F6FCF8;
  --mast:#1E5A3A; --mast-ink:#FFFFFF; --mast-sym:rgba(255,255,255,.09); --mast-muted:rgba(255,255,255,.78);
  --candy:#2E8B57; --candy-ink:#FFFFFF; --candy-2:#DDF1E4;
  --p1:#0D7F73; --p1-soft:#DCF2EE; --p2:#5A7D1A; --p2-soft:#EAF2D6; --p3:#2E8B57; --p3-soft:#DDF1E4; --p4:#1F6B4F; --p4-soft:#DCEDE5;
  --page-sym:rgba(31,122,74,.07);
  --serif:'Literata', Georgia, 'Times New Roman', serif;
  --sans:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --logic:'STIX Two Text', 'Cambria Math', 'Times New Roman', serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1E16; --surface:#172A20; --ink:#E4F2E9; --muted:#9FBFAC; --line:#2C4636;
    --accent:#6FD39C; --accent-ink:#0F1E16;
    --good:#5FCB9C; --good-tint:#16352B; --bad:#FF8F84; --bad-bg:#3A1E22;
    --soft:#1F3529; color-scheme: dark;
    --blob1:rgba(80,200,130,.18); --blob2:rgba(160,210,90,.16); --blob3:rgba(86,211,195,.14); --blob4:rgba(200,230,120,.10); --lock-line:#2F4A3A; --lock-ring:rgba(80,200,130,.12); --lock-glow:rgba(80,200,130,.45); --lock-field:#142319;
    --mast:#1F5A3C; --mast-ink:#FFFFFF; --mast-sym:rgba(255,255,255,.08); --mast-muted:rgba(255,255,255,.75);
    --candy:#5FCB8F; --candy-ink:#0A1A10; --candy-2:#1E3A2A;
    --p1:#56D3C3; --p1-soft:#14322E; --p2:#B5D46A; --p2-soft:#2B3514; --p3:#6FD39C; --p3-soft:#183A28; --p4:#4FBF95; --p4-soft:#163329;
    --page-sym:rgba(111,211,156,.07);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1E16; --surface:#172A20; --ink:#E4F2E9; --muted:#9FBFAC; --line:#2C4636;
  --accent:#6FD39C; --accent-ink:#0F1E16;
  --good:#5FCB9C; --good-tint:#16352B; --bad:#FF8F84; --bad-bg:#3A1E22;
  --soft:#1F3529; color-scheme: dark;
    --blob1:rgba(80,200,130,.18); --blob2:rgba(160,210,90,.16); --blob3:rgba(86,211,195,.14); --blob4:rgba(200,230,120,.10); --lock-line:#2F4A3A; --lock-ring:rgba(80,200,130,.12); --lock-glow:rgba(80,200,130,.45); --lock-field:#142319;
    --mast:#1F5A3C; --mast-ink:#FFFFFF; --mast-sym:rgba(255,255,255,.08); --mast-muted:rgba(255,255,255,.75);
    --candy:#5FCB8F; --candy-ink:#0A1A10; --candy-2:#1E3A2A;
    --p1:#56D3C3; --p1-soft:#14322E; --p2:#B5D46A; --p2-soft:#2B3514; --p3:#6FD39C; --p3-soft:#183A28; --p4:#4FBF95; --p4-soft:#163329;
    --page-sym:rgba(111,211,156,.07);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding-block:20px 64px;padding-left:max(18px, env(safe-area-inset-left,0px));padding-right:max(18px, env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:2.4rem;letter-spacing:-.01em}
h2{font-size:1.55rem}
h3{font-size:1.1rem}
p{margin:.4em 0}
.muted{color:var(--muted)}
.f{font-family:var(--logic);white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.back{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:700;margin-bottom:10px}

/* Home */
.hero{display:flex;align-items:center;gap:16px;margin:8px 0 6px}
.hero svg{width:84px;height:auto;flex:none}
.tagline{font-size:1.05rem;color:var(--muted);max-width:34ch}
.levels{list-style:none;margin:28px 0 0;padding:0;border-top:1px solid var(--line)}
.level{border-bottom:1px solid var(--line);padding:16px 0}
.level-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.level-num{font-family:var(--serif);color:var(--muted);font-size:.95rem;white-space:nowrap}
.topics{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
.topic{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--accent);background:var(--surface);border-radius:12px;padding:12px 14px}
.topic:hover{background:var(--soft)}
.topic small{display:block;color:var(--muted);font-size:.88rem}
.go{color:var(--accent);font-weight:700;white-space:nowrap}

/* Exercise */
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.score{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prop{font-family:var(--serif);font-size:1.4rem;line-height:1.35;margin:14px 0 6px}
.prop mark{background:var(--soft);color:var(--ink);border-bottom:2px solid var(--accent);padding:0 2px}
.formula{font-family:var(--logic);font-size:1.6rem;line-height:1.6;margin:12px 0 4px;display:flex;flex-wrap:wrap;align-items:baseline;row-gap:4px}
.formula .sp{width:.3em}
.tok{border:0;background:transparent;padding:0 2px;border-radius:5px;font-family:var(--logic);font-size:inherit;line-height:inherit}
.tok.tap{border-bottom:2px dashed var(--muted);margin:0 1px}
.tok.tap:hover{background:var(--soft)}
.tok.sel{background:var(--soft);border-bottom:2px solid var(--accent)}
.tok.right{background:var(--good-tint);border-bottom:2px solid var(--good)}
.tok.wrong{background:var(--bad-bg);border-bottom:2px solid var(--bad)}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.92rem;color:var(--muted);margin:6px 0 0}
.key b{color:var(--ink);font-family:var(--logic);font-weight:600}
.step{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.step h3{margin-bottom:4px}
.step .hint{font-size:.92rem;color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.choices.one{grid-template-columns:1fr}
.choices.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;min-width:0;overflow-wrap:anywhere}
.choice b{font-family:var(--serif);margin-right:6px}
.choice.picked{border-color:var(--accent);background:var(--soft)}
.choice.right{border-color:var(--good);background:var(--good-tint)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice .why{display:block;font-size:.88rem;color:var(--muted);margin-top:4px;font-family:var(--sans)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:6px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.builder{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:12px;font-family:var(--logic);font-size:1.3rem}
.builder select{font-family:var(--logic);font-size:1.15rem;padding:6px 6px;min-width:0}
select{font:inherit;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.preview{margin-top:10px;font-size:.92rem;color:var(--muted)}
.preview .f{color:var(--ink);font-size:1.25rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:.97rem}
.fb.good{background:var(--good-tint);color:var(--ink);border-left:4px solid var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--ink);border-left:4px solid var(--bad)}
.fb strong{display:block;margin-bottom:2px}
.fb ul{margin:6px 0 0;padding-left:1.2em}
.fb li{margin:3px 0}
.next{margin-top:30px;display:flex;justify-content:flex-end}
/* Front screens */
.syms{position:absolute;inset:0;overflow:hidden;pointer-events:none;font-family:var(--logic);user-select:none}
.syms span{position:absolute;line-height:1;transform:rotate(var(--r))}
.page-syms{position:fixed;z-index:0;color:var(--page-sym)}
.lock{position:relative;z-index:1;max-width:400px;margin:9vh auto 0;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 24px 26px;box-shadow:0 18px 50px -24px rgba(20,48,31,.35)}
.lock .tile{width:76px;height:76px;margin-top:-68px;border-radius:20px;background:var(--mast);color:var(--mast-ink);display:grid;place-items:center;font-family:var(--logic);font-size:34px;box-shadow:0 10px 24px -10px rgba(30,90,58,.6)}
.lock h1{font-size:2.5rem;margin-top:6px}
.lock .sub{color:var(--muted);margin:0}
.lock .code-form{margin-top:10px;text-align:center}
.t-ico.small{font-size:.95rem}
.lock input[type=text]{text-align:center;font-size:1.3rem;letter-spacing:.18em;padding:14px 12px;font-family:var(--logic)}
.lock .chip{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;color:var(--candy);background:var(--candy-2);border-radius:999px;padding:4px 12px;font-weight:700}
.mast{position:relative;overflow:hidden;background:var(--mast);color:var(--mast-ink);border-radius:24px;padding:30px 24px 24px;margin-top:4px}
.mast .syms{color:var(--mast-sym)}
.mast > *:not(.syms){position:relative}
.kicker{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mast-muted);margin:0;font-weight:700}
.mast h1{font-size:clamp(2.6rem,9vw,3.6rem);letter-spacing:-.02em;margin-top:6px;color:var(--mast-ink)}
.mast h1 .f{font-size:.8em;opacity:.55;margin-left:.15em}
.mast-tag{color:var(--mast-muted);font-size:1.08rem;margin:.3em 0 0;max-width:34ch}
.mast .candy-cta{margin-top:22px}
.part-head{display:flex;align-items:center;gap:12px}
.part-badge{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--pc);color:var(--surface);font-family:var(--serif);font-weight:600;font-size:1rem}
.part-head h2{font-size:1.3rem}
.part-head .level-num{margin-left:auto}
.level{--pc:var(--p4);--pcs:var(--p4-soft)}
.level.part-1{--pc:var(--p1);--pcs:var(--p1-soft)}
.level.part-2{--pc:var(--p2);--pcs:var(--p2-soft)}
.level.part-3{--pc:var(--p3);--pcs:var(--p3-soft)}
.levels .topic{border-color:var(--line);display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;padding:12px 14px 12px 12px;transition:border-color .15s, transform .15s}
.levels .topic:hover{border-color:var(--pc);background:var(--surface);transform:translateY(-1px)}
.t-ico{width:44px;height:44px;border-radius:12px;background:var(--pcs);color:var(--pc);display:grid;place-items:center;font-family:var(--logic);font-size:1.25rem;font-weight:600}
.levels .go{color:var(--pc)}
@media (prefers-reduced-motion:reduce){ .levels .topic{transition:none} .levels .topic:hover{transform:none} }
.code-form{display:grid;gap:8px;width:100%;margin-top:8px;text-align:left}
.code-form .btn{justify-self:stretch}
.code-err{color:var(--bad);font-size:.95rem;margin:0}
input[aria-invalid="true"]{border-color:var(--bad)}
/* Candy Challenge */
.candy-cta{position:relative;overflow:hidden;display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--candy);color:var(--candy-ink);border:0;border-radius:16px;padding:18px 16px 16px;margin-top:22px;box-shadow:0 10px 24px -12px rgba(0,0,0,.45)}
.candy-cta::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.85) 0 8px,transparent 8px 16px)}
.candy-cta:hover{filter:brightness(1.06)}
.candy-cta .go-light{background:var(--candy-ink);color:var(--candy);border-radius:999px;padding:6px 14px}
.candy-cta b{font-family:var(--serif);font-size:1.25rem;display:block}
.candy-cta small{display:block;opacity:.88;font-size:.9rem}
.candy-ico{font-size:2.2rem;line-height:1}
.go-light{font-weight:700;white-space:nowrap;margin-left:auto}
.game-hero{text-align:center;display:grid;gap:6px;justify-items:center;margin-top:6px}
.game-hero p{max-width:40ch}
.big-candy{font-size:64px;line-height:1}
input[type=text]{font:inherit;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%;margin-top:8px}
input[type=text]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.big{font-size:1.1rem;padding:14px 24px}
.gbar{display:grid;gap:6px;margin-bottom:14px}
.gbar-row{display:flex;justify-content:space-between;font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px}
.dots i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.dots i.hit{background:var(--good)} .dots i.miss{background:var(--bad)} .dots i.now{background:var(--accent)}
.cheer{color:var(--good);font-weight:700;white-space:nowrap}
.win{text-align:center;background:var(--surface);border:2px solid var(--accent);border-radius:18px;padding:30px 18px;display:grid;gap:6px;justify-items:center;position:relative;z-index:6;margin-top:10px}
.win.lose{border-color:var(--line)}
.win h1{font-size:2.2rem}
.eyebrow{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.cheer-big{font-family:var(--serif);font-size:1.4rem;color:var(--good);margin:0}
.final{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.stamp{font-size:.9rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:6px}
.actions.center{justify-content:center;margin-top:18px}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.rain span{position:absolute;top:-60px;animation-name:fall;animation-timing-function:linear;animation-iteration-count:3}
@keyframes fall{to{transform:translateY(115vh) rotate(380deg)}}
/* Win: sparkle explosions */
.boom{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.boom i{position:absolute;left:var(--x);top:var(--y);font-style:normal;line-height:1;transform:translate(-50%,-50%) scale(.2);opacity:0;animation:burst var(--t) cubic-bezier(.15,.8,.3,1) var(--w) forwards}
.boom i.dot{width:var(--s);height:var(--s);border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
@keyframes burst{
  0%{transform:translate(-50%,-50%) scale(.2);opacity:1}
  70%{opacity:1}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--rot));opacity:0}}
.boom .flash{position:absolute;left:var(--x);top:var(--y);width:24px;height:24px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,215,90,.8) 40%,transparent 70%);transform:translate(-50%,-50%) scale(0);animation:flash .6s ease-out var(--w) forwards}
@keyframes flash{0%{transform:translate(-50%,-50%) scale(0);opacity:1}100%{transform:translate(-50%,-50%) scale(9);opacity:0}}

.bounce{animation:bounce 1s ease-in-out infinite alternate}
@keyframes bounce{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-12px) rotate(6deg)}}
@media (prefers-reduced-motion:reduce){ .rain{display:none} .bounce{animation:none} }
@media (max-width:420px){ h1{font-size:2rem} .prop{font-size:1.25rem} .formula{font-size:1.35rem} .choices{grid-template-columns:1fr} .choices.three{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (prefers-reduced-motion:no-preference){ .fb{animation:pop .18s ease-out} @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}} }
.gclock{font-variant-numeric:tabular-nums;font-weight:700}
.gclock.low{color:var(--bad, #c0392b)}
.exnum{margin:-.4rem 0 .8rem;font-weight:600}


/* Cute home header */
.mast{background:linear-gradient(135deg,#1F7A4A 0%,#2E8B57 55%,#3BAFA0 100%);box-shadow:0 20px 44px -24px rgba(31,122,74,.6)}
.mast .syms{color:rgba(255,255,255,.14)}
.mast h1 .f{opacity:.7}
.mast .candy-cta{background:var(--surface);color:var(--ink);box-shadow:0 12px 26px -14px rgba(20,60,40,.55)}
.mast .candy-cta::before{background:repeating-linear-gradient(-45deg,var(--candy) 0 8px,transparent 8px 16px);opacity:.85}
.mast .candy-cta small{color:var(--muted);opacity:1}
.mast .candy-cta b{color:var(--candy)}
.mast .candy-cta .go-light{background:linear-gradient(90deg,var(--candy),#3BA776);color:#fff}
.levels,.mast{position:relative;z-index:1}

/* Progress: what's been done */
.prog{margin-top:18px;background:rgba(255,255,255,.18);border-radius:14px;padding:10px 14px}
.prog-row{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:.95rem}
.prog-bar{height:10px;border-radius:999px;background:rgba(255,255,255,.3);margin-top:7px;overflow:hidden}
.prog-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FFE27A,#FFFFFF)}
.tbar{height:6px;border-radius:999px;background:var(--soft);margin-top:7px;overflow:hidden;max-width:220px}
.tbar i{display:block;height:100%;border-radius:999px;background:var(--pc)}
.levels .topic.is-done{border-color:var(--good);background:var(--good-tint)}
.levels .topic.is-done .t-ico{background:var(--good);color:#fff;font-family:var(--sans)}
.levels .topic.is-done .go{color:var(--good)}
.part-done{margin-left:auto;font-weight:700;font-size:.85rem;color:#fff;background:var(--good);border-radius:999px;padding:3px 10px;white-space:nowrap}
.reset-row{text-align:center;margin:26px 0 8px}
.reset{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.9rem;padding:6px}
/* ===== Cute front screen ===== */
.cute-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:
  radial-gradient(40vmax 40vmax at 8% 12%, var(--blob1), transparent 60%),
  radial-gradient(38vmax 38vmax at 92% 18%, var(--blob2), transparent 60%),
  radial-gradient(44vmax 44vmax at 80% 95%, var(--blob3), transparent 60%),
  radial-gradient(36vmax 36vmax at 10% 90%, var(--blob4), transparent 60%),
  var(--paper)}
.cute-bg span{position:absolute;line-height:1;font-family:var(--logic);font-weight:700;opacity:.85;transform:rotate(var(--r))}

<script>
// ===== Helpers =====
// Seeded randomness: every student sees the exact same exercises, in the same order.
let R=Math.random;
function seeded(key){ let h=2166136261; for(const c of key){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } let x=h>>>0; return ()=>{ x=(x+0x6D2B79F5)|0; let t=Math.imul(x^x>>>15,1|x); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function withSeed(key,fn){ const old=R; R=seeded(key); try{ return fn(); } finally{ R=old; } }
const pick = a => a[Math.floor(R()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F = s => `<span class="f">${esc(s)}</span>`;
const fmt = t => esc(t).replace(/\{([^}]*)\}/g,'<span class="f">$1</span>');

// ===== Saved progress (this browser only) =====
const KEY='class12-ple-v1';

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(progress)); }catch(e){} }
const progress = load();
const doneMap = id => (progress.sets||(progress.sets={}))[id]||(progress.sets[id]={});
function markDone(id,k){ doneMap(id)[k]=1; save(); }
function tally(ok){
  if(game){ gameRecord(ok); return; }
  const p=progress[cur.id]||(progress[cur.id]={done:0,right:0}); p.done++; if(ok) p.right++; markDone(cur.id,cur.k);
}
const sc = id => { const p=progress[id]; return p?`${p.right}/${p.done}`:'0/0'; };

// ===== Symbolization keys =====
const K = {
  basket:[['UD','things in a fruit basket'],['Ax','x is an apple'],['Px','x is a pear'],['Rx','x is rotten']],
  family:[['UD','people'],['Dxy','x is a daughter of y'],['Mxy','x is married to y'],['Px','x is a pilot'],['k','Kim'],['r','Ray']],

// ===== Definitions (intro flashcards) =====
const DEFS1=[
  {t:'Non-referring expression', d:'A name or description that designates nothing, like ‘the Fountain of Youth’. It cannot be symbolized as an individual constant.'},
  {t:'Looking for something that may not exist', d:'Build the whole activity into a one-place predicate.', x:'{Tm}', xs:'Max is looking for trolls. Tx: x is looking for trolls'},
  {t:'Looking for a particular thing', d:'When one specific thing exists and is being sought, use an existential quantifier with &.', x:'{(∃z)[(Oz & Mz) & Lmz]}', xs:'Mike is looking for the orangutan that is missing.'},
  {t:'Looking for every thing of a kind', d:'When every member of a kind is sought, use a universal quantifier with ⊃.', x:'{(∀y)[(Oy & My) ⊃ Lmy]}', xs:'Mike is looking for all the missing orangutans.'},
  {t:'Choosing predicates', d:'One sentence can often be symbolized with one, two, or three predicates. Choose the ones that show the connections an argument depends on.'},
  {t:'Splitting an adjective', d:'Split an adjective off as its own predicate only when its meaning does not depend on the noun. ‘Green umbrella’ splits. ‘Small elephant’ and ‘good violinist’ do not.'},
  {t:'Quantifier order', d:'Two quantifiers of the same type can be swapped. Mixed quantifiers cannot.', x:'{(∀x)(∃y)Lxy}   vs   {(∃y)(∀x)Lxy}', xs:'Everyone loves someone, vs. there is one person everyone loves.'},
  {t:'Moving a quantifier', d:'A quantifier can move out over &, ∨, or into the front of a conditional’s consequent and keep its type. Out of an antecedent it flips (∀ ↔ ∃). Across ≡ it cannot move.', x:'{(∃x)Fx ⊃ Ga}  =  {(∀x)(Fx ⊃ Ga)}'},
];
const DEFS2=[
  {t:'Identity predicate', d:'A two-place predicate “=” that always means “is identical to”: one and the same object. It never needs a line in the symbolization key.', x:'{a = b}     {~ a = b}', xs:'a is b.   a is not b.'},
  {t:'At least two', d:'Two different variables do not promise two different things. Add “x is not y”.', x:'{(∃x)(∃y)[(Ax & Ay) & ~ x = y]}'},
  {t:'Exactly one', d:'There is one, and anything of that kind is that very one.', x:'{(∃x)[Ax & (∀y)(Ay ⊃ y = x)]}'},
  {t:'At most one', d:'Any two of them are the same. This is true even if there are none.', x:'{(∀x)(∀y)[(Ax & Ay) ⊃ x = y]}'},
  {t:'Except', d:'Set one individual apart from all the others.', x:'{~ Ah & (∀y)(~ y = h ⊃ Ay)}', xs:'Everyone except Henry has read it.'},
  {t:'Definite description', d:'“The F” claims that exactly one thing is F. “The F is G” becomes a unique existence claim. If nothing is F, or several things are, the sentence is false (not meaningless).', x:'{(∃x)[(Fx & (∀y)(Fy ⊃ y = x)) & Gx]}'},
  {t:'Reflexive relation', d:'Everything bears the relation to itself. Example: x is the same age as y (UD: people).', x:'{(∀x)Axx}'},
  {t:'Symmetric relation', d:'If x bears it to y, then y bears it to x. Example: x is a sibling of y.', x:'{(∀x)(∀y)(Axy ⊃ Ayx)}'},
  {t:'Transitive relation', d:'If x bears it to y and y to z, then x bears it to z. Example: x is taller than y.', x:'{(∀x)(∀y)(∀z)[(Axy & Ayz) ⊃ Axz]}'},
  {t:'Function and functor', d:'A function takes arguments and returns exactly one value, which must be in the UD. A functor is its symbol.', x:'{f(a) = b}', xs:'f(x): the successor of x, a: 2, b: 3. “The successor of 2 is 3.”'},
  {t:'Complex, open, and closed terms', d:'A functor applied to terms makes a complex term. A term with no variable is closed; one with a variable is open.', x:'closed: {a}, {f(a)}     open: {x}, {f(x)}'},
  {t:'Substitution instance', d:'Drop the first quantifier and replace its variable everywhere with the same closed term. A closed complex term like f(a) works too.', x:'{(∀x)Ef(x)}  →  {Ef(a)}'},
];

// ===== Multiple-choice practice =====
const LOOK=[
  {q:'Theo is searching for a unicorn. Which is the best symbolization?', key:[['Ux','x is a unicorn'],['Sxy','x searches for y'],['t','Theo']],
   o:['{(∃x)(Ux & Stx)}','{(∀x)(Ux ⊃ Stx)}','{Ft}, where Fx: x is searching for a unicorn','{Stu}, where u: the unicorn'], a:2,
   w:['This says there is a unicorn.','This is true if there are no unicorns, but it also says Theo searches for every unicorn.','','There is no unicorn for ‘u’ to designate.'],
   e:'Unicorns do not exist and no particular one is sought, so build “searching for a unicorn” into a one-place predicate.'},
  {q:'A painting was stolen from the museum, and Detective Ruiz is looking for it. Which fits?', key:[['Px','x is a painting'],['Sx','x was stolen from the museum'],['Lxy','x is looking for y'],['r','Ruiz']],
   o:['{(∃y)[(Py & Sy) & Lry]}','{Lr}, where Lx: x is looking for a painting','{(∀y)[(Py & Sy) ⊃ Lry]}','{(∃y)[(Py & Sy) ⊃ Lry]}'], a:0,
   w:['','That loses the fact that one particular painting is sought.','This does not say a stolen painting exists.','∃ with ⊃ is true as soon as anything is not a stolen painting.'],

  {q:'Ines wants every stamp from Peru. Which fits?', key:[['Sx','x is a stamp'],['Px','x is from Peru'],['Wxy','x wants y'],['i','Ines']],
   o:['{(∃y)[(Sy & Py) & Wiy]}','{(∀y)[(Sy & Py) ⊃ Wiy]}','{(∀y)[(Sy & Py) & Wiy]}','{Wi}, where Wx: x wants a stamp'], a:1,
   w:['That says she wants at least one.','','That says everything is a Peruvian stamp.','That loses ‘every’ and ‘from Peru’.'],
   e:'Every thing of a kind is wanted, so use ∀ with ⊃.'},
  {q:'Which phrase can safely be split into two predicates?', o:['‘tall jockey’','‘good violinist’','‘fake diamond’','‘green umbrella’'], a:3, fixed:true,
   w:['A tall jockey can be short for a person.','A good violinist need not be a good person.','A fake diamond is not a diamond at all.',''],
   e:'A green umbrella is green and is an umbrella. The meaning of ‘green’ does not depend on the noun.'},
];
const COUNT=[
  {q:'There are at least two pears.', key:K.basket,
   o:['{(∃x)(∃y)(Px & Py)}','{(∃x)(∃y)[(Px & Py) & ~ x = y]}','{(∀x)(∀y)[(Px & Py) ⊃ ~ x = y]}','{(∃x)(∃y)[(Px & Py) & x = y]}'], a:1,
   w:['x and y can be the same pear, so this only says there is at least one.','','This says no pear is identical to itself, so it is false whenever there is a pear.','This says there is at least one pear.'],
   e:'Two variables do not guarantee two things. The clause {~ x = y} does.'},
  {q:'There is exactly one rotten apple.', key:K.basket,
   o:['{(∃x)(Ax & Rx)}','{(∀x)(∀y)[((Ax & Rx) & (Ay & Ry)) ⊃ x = y]}','{(∃x)[(Ax & Rx) & (∀y)((Ay & Ry) ⊃ y = x)]}','{(∃x)[(Ax & Rx) & (∀y)(Ay ⊃ y = x)]}'], a:2,
   w:['That is “at least one.”','That is “at most one.” It does not say there is one.','','This says there is only one apple of any kind.'],
   e:'There is a rotten apple, and every rotten apple is that very one.'},
  {q:'There is at most one pear.', key:K.basket,
   o:['{(∃x)[Px & (∀y)(Py ⊃ y = x)]}','{(∀x)(∀y)[(Px & Py) ⊃ x = y]}','{~ (∃x)(∃y)(Px & Py)}','{(∀x)(Px ⊃ ~ Px)}'], a:1,
   w:['That is “exactly one.” It is false if there are no pears.','','x and y may be the same pear, so this says there are no pears at all.','This says there are no pears.'],
   e:'“At most one” does not claim that a pear exists. Any two pears you pick are the same pear.'},
  {q:'Apple a is the only apple that is not rotten.', key:[...K.basket,['a','one particular apple']],
   o:['{~ Ra & (∀x)(Ax ⊃ Rx)}','{(Aa & ~ Ra) & (∀x)[(Ax & ~ x = a) ⊃ Rx]}','{(Aa & ~ Ra) & (∀x)(Rx ⊃ ~ x = a)}','{(∀x)[(Ax & ~ x = a) ⊃ ~ Rx]}'], a:1,
   w:['If a is an apple, this says a is rotten and not rotten.','','This says nothing about the other apples.','This says the other apples are not rotten.'],
   e:'a is a fresh apple, and every other apple is rotten.'},
  {q:'There are exactly two apples.', key:K.basket,

   w:['That is “at least two.”','That is “at most two.”','','No z can equal both x and y when x and y differ, so this can never be true.'],
   e:'At least two different apples, and any apple is one of those two.'},

const WORLD=[
  {b:['A','A','P'], f:'(∃x)[Ax & (∀y)(Ay ⊃ y = x)]', ans:false, eng:'There is exactly one apple.', e:'There are two apples, so it is false.'},
  {b:['A','P'], f:'(∃x)(∃y)(Ax & Ay)', ans:true, eng:'There is at least one apple.', e:'x and y can both be the one apple. No ~ x = y clause, so one apple is enough.'},
  {b:['P','P*'], f:'(∀x)(∀y)[(Ax & Ay) ⊃ x = y]', ans:true, eng:'There is at most one apple.', e:'There are no apples, so no two apples are different. “At most one” is true.'},
  {b:['A','A*','P*'], f:'(∃x)[(Px & Rx) & (∀y)(Py ⊃ y = x)]', ans:true, eng:'The only pear is rotten.', e:'There is exactly one pear, and it is rotten.'},
  {b:['A*','A*','A'], f:'(∃x)(∃y)(∃z)[((Ax & Ay) & Az) & ((~ x = y & ~ y = z) & ~ x = z)]', ans:true, eng:'There are at least three apples.', e:'There are three different apples. Rotten or not, they are apples.'},
];
const DESC=[
  {q:'Kim’s only daughter is a pilot.', key:K.family,
   o:['{(∃x)(Dxk & Px)}','{(∃x)[(Dxk & (∀y)(Dyk ⊃ y = x)) & Px]}','{Pd}, where d: Kim’s only daughter','{(∀x)(Dxk ⊃ Px)}'], a:1,
   w:['This leaves out “only.”','','A constant hides the claim that Kim has exactly one daughter.','This is true if Kim has no daughters.'],
   e:'There is a daughter of Kim, she is Kim’s only daughter, and she is a pilot.'},
  {q:'Ray is married to Kim’s only daughter.', key:K.family,

   w:['That says Ray is married to Kim.','This leaves out “only.”','This is true if Kim has no daughter.',''],
   e:'A definite description becomes a unique existence claim: exactly one daughter, and Ray is married to her.'},
  {q:'Kim has two daughters. What is the truth value of “Kim’s only daughter is a pilot”?', o:['True, if one of them is a pilot','False','Meaningless','Neither true nor false'], a:1, fixed:true,

  {q:'France has no king. Which of these is TRUE?', key:[['Kx','x is a present king of France'],['Bx','x is bald']],

   w:['There is no king, so “the king is bald” is false.','There is no king, so “the king is not bald” is false too.','','There is no king.'],
   e:'This is Bertrand Russell’s famous example. “It is not the case that the king of France is bald” is true. Where the “not” goes changes the meaning.'},
  {q:'Why symbolize “the Roman general who defeated Pompey” with identity instead of a constant r?', o:['Constants can’t name people','A constant hides that r defeated Pompey, so a valid argument looks invalid','Identity sentences are shorter','Constants can’t appear in arguments'], a:1, fixed:true,

const REL=[

const TERMS=[['f(a)',1,1],['h(x,b)',1,0],['y',0,0],['g(f(a),c)',1,1]];
const TERM=TERMS.map(([t,cx,cl])=>({q:`What kind of term is {${t}}?`, o:['Simple and closed','Simple and open','Complex and closed','Complex and open'], a:cx*2+(cl?0:1), fixed:true,

// ===== Quantifier order (from the earlier class) =====
const VERBS=[{L:'L', vs:'likes', pp:'liked'}, {L:'T', vs:'trusts', pp:'trusted'}, {L:'A', vs:'admires', pp:'admired'}, {L:'K', vs:'knows', pp:'known'}];
const RS = (q1,q2,ord,on=0,n2=0,n3=0)=>({on,q1,n2,q2,n3,ord});
const ORDER=[
  {v:0, say:v=>`Everyone ${v.vs} someone.`, st:RS('∀','∃','xy'), e:v=>`Each person x ${v.vs} some y or other. Different people may pick different ys, so (∀x) comes first.`},
  {v:2, say:v=>`There is someone whom everyone ${v.vs}.`, st:RS('∃','∀','yx'), e:v=>`One person x is such that every y ${v.vs} x. So (∃x) comes first and x goes in the second place.`},
  {v:3, say:v=>`No one ${v.vs} everyone.`, st:RS('∃','∀','xy',1), e:v=>`It is not the case that someone ${v.vs} everyone. (∀x)(∃y)~${v.L}xy is an equivalent way to write it.`},
];
const PEOPLE=['Ana','Ben','Cy'];
function evalRel(st,n,Rl){
  const L=(a,b)=>!!((Rl>>(a*n+b))&1), D=[...Array(n).keys()];
  const atom=(x,y)=>{ const v=st.ord==='xy'?L(x,y):L(y,x); return st.n3?!v:v; };
  const inner=x=>{ const r=st.q2==='∀'?D.every(y=>atom(x,y)):D.some(y=>atom(x,y)); return st.n2?!r:r; };
  const v=st.q1==='∀'?D.every(inner):D.some(inner);
  return st.on?!v:v;
}
function relCounter(a,b){
  for(let n=1;n<=3;n++){ let best=null;
    for(let Rl=0;Rl<(1<<(n*n));Rl++){ if(evalRel(a,n,Rl)!==evalRel(b,n,Rl)){ const pc=Rl.toString(2).split('1').length-1; if(!best||pc<best.pc) best={n,R:Rl,pc}; } }
    if(best) return best; }
  return null;
}
const ordStr = (st,L) => `${st.on?'~':''}(${st.q1||'?'}x)${st.n2?'~':''}(${st.q2||'?'}y)${st.n3?'~':''}${L}${st.ord||'??'}`;

];

function symLayer(n, seed){
  let x=seed; const rnd=()=>((x=(x*16807)%2147483647)/2147483647);
  const G=['∀','∃','⊃','=','~','&','∨','x','y','f(x)','(∀x)','(∃y)'];
  let out='';
  for(let i=0;i<n;i++) out+=`<span style="left:${(rnd()*100).toFixed(1)}%;top:${(rnd()*100).toFixed(1)}%;font-size:${(18+rnd()*46).toFixed(0)}px;--r:${(rnd()*40-20).toFixed(0)}deg">${esc(G[Math.floor(rnd()*G.length)])}</span>`;
  return `<div class="syms" aria-hidden="true">${out}</div>`;
}

function gameBar(title){
  const g=game, n=g.items.length;
  const dots=g.items.map((_,k)=>`<i class="${k<g.i||(k===g.i&&g.answered)?(g.hist[k]?'hit':'miss'):k===g.i?'now':''}"></i>`).join('');
  return `<div class="gbar"><div class="gbar-row"><span>Question ${g.i+1} of ${n}</span><span>${g.right} correct</span></div><div class="dots" aria-hidden="true">${dots}</div></div>
  <div class="ex-head"><h2>${title}</h2></div>`;
}
function startGame(){
  game={items:TEST.map((_,i)=>i), i:-1, right:0, answered:false, hist:[]};
  gameNext();
}
function gameNext(){
  if(game.i>=0 && !game.answered) game.hist[game.i]=false;
  game.i++; game.answered=false;
  if(game.i>=game.items.length){ finishGame(); return; }
  view='act'; cur=fresh('test',game.i,TEST[game.items[game.i]]);
  render(); window.scrollTo(0,0);
}
function finishGame(){
  lastGame=game; game=null;
  progress.best=Math.max(progress.best??0, lastGame.right); save();
  view='gameEnd'; cur=null; render(); window.scrollTo(0,0);
}
VIEWS.gameStart = () => `${backHome}
  <div class="game-hero"><div class="big-candy test-big" aria-hidden="true">✓</div>
    <h2>Test your knowledge</h2>
    <p>Ten questions on everything from today: looking for things, quantifier order, counting with identity, definite descriptions, relations, and functions.</p>
  </div>
  <section class="step">
    <p class="hint">Only your first answer to each question counts. You can skip a question, but a skip counts as a miss. You’ll see an explanation after each answer and your score at the end.</p>
    <div class="actions"><button class="btn big" data-act="start-game">Start the test</button></div>
  </section>`;
VIEWS.gameEnd = () => {
  const g=lastGame, n=g.items.length, pct=Math.round(g.right/n*100);
  const rows=g.items.map((ti,k)=>{ const q=TEST[ti]; return `<li class="${g.hist[k]?'ok':'no'}"><span aria-hidden="true">${g.hist[k]?'✓':'✗'}</span> ${fmt(q.q)}${g.hist[k]?'':`<span class="why">Answer: ${fmt(q.o[q.a])}</span>`}</li>`; }).join('');
  const missed=[...new Set(g.items.filter((_,k)=>!g.hist[k]).map(i=>TEST[i].tag))];
  const practice = missed.length ? `<section class="step"><h3>Practice these, then try again</h3><ul class="topics">${missed.map(id=>`<li><button class="topic" data-go="act" data-arg="${id}" data-k="0"><span>${esc(ACTS[id].name)}</span><span class="go">Practice</span></button></li>`).join('')}</ul></section>` : '';
  const msg = g.right===n ? 'Perfect score!' : g.right>=8 ? 'Great work!' : g.right>=5 ? 'Good effort.' : 'Keep practicing.';
  return `<div class="win${g.right>=8?'':' lose'}" role="status">
      <p class="eyebrow">Test your knowledge</p>
      <h1>${msg}</h1>
      <p class="final">${g.right} of ${n} right · ${pct}%</p>
    </div>
    <section class="step"><h3>Your answers</h3><ol class="results">${rows}</ol></section>
    <div class="actions center"><button class="btn" data-act="replay">Take it again</button><button class="btn ghost" data-go="home">Back to practice</button></div>
    ${practice}`;
};

// ===== Events =====
app.addEventListener('click', ev=>{
  const t=ev.target;
  const act=t.closest('[data-act]')?.dataset.act;
  if(act==='start-game'){ startGame(); return; }
  if(act==='replay'){ go('gameStart'); return; }
  if(act==='quit-game'){ game=null; go('home'); return; }
  if(act==='next' && game){ gameNext(); return; }
  if(act==='reset'){ if(confirm('Start over? This clears which exercises you have done on this device.')){ for(const k of Object.keys(progress)) delete progress[k]; save(); render(); } return; }
  const goEl=t.closest('[data-go]'); if(goEl){ go(goEl.dataset.go, goEl.dataset.arg, goEl.dataset.k); return; }
  if(view!=='act') return;
  const it=cur.item, d=k=>t.closest(`[data-${k}]`)?.dataset[k];
  let v;
  if(act==='reveal'){ cur.shown=true; markDone(cur.id,cur.k); render(); return; }
  if((v=d('mc'))!==undefined && cur.pickd===null){ cur.pickd=+v; tally(cur.pickd===it.a); render(); return; }
  if((v=d('tf'))!==undefined && cur.pickd===null){ cur.pickd = v==='true'; tally(cur.pickd===it.ans); render(); return; }
  if((v=d('move'))!==undefined && cur.pickd===null){ cur.pickd=v; tally(v===it.ans); render(); return; }
  if((v=d('rel'))!==undefined && !cur.checked){ const [i,val]=v.split(':').map(Number); cur.ans[i]=val; render(); return; }
  if(act==='check-rel' && !cur.checked){ cur.checked=true; tally(cur.ans.every((a,i)=>a===it.ans[i])); render(); return; }
  if(act==='check-order'){
    const c=relCounter(it.st, cur.b); cur.result={ok:!c, counter:c};
    if(!cur.counted){ cur.counted=true; tally(!c); }
    render(); return;
  }
  if(act==='next'){ if(cur.k+1<nOf(cur.id)) go('act',cur.id,cur.k+1); else go('done',cur.id); return; }
});
app.addEventListener('change', ev=>{
  const t=ev.target;
  if(view==='act' && t.dataset.o){ const k=t.dataset.o; cur.b[k]=['on','n2','n3'].includes(k)?+t.value:t.value; if(cur.result&&!cur.result.ok) cur.result=null; render(); document.getElementById('ord-'+k)?.focus(); }
});
// ===== Class code =====
const CLASS_CODE='class12';
const normCode = v => String(v||'').toLowerCase().replace(/\s+/g,'');
let unlocked=false; try{ unlocked = localStorage.getItem('class12-unlocked')==='yes'; }catch(e){}
let codeError=false;
function cuteBg(n=22){
  let x=29; const rnd=()=>((x=(x*16807)%2147483647)/2147483647);
  const SY=['∀','∃','⊃','=','~','&','∨'], COL=['var(--candy)','#3BA776','var(--p1)','var(--p2)','var(--p4)'];
  let out='';
  for(let i=0;i<n;i++){
    const l=(rnd()*96).toFixed(1), t=(rnd()*94).toFixed(1), r=(rnd()*40-20).toFixed(0), d=(2.6+rnd()*3).toFixed(1);
    out+=`<span style="left:${l}%;top:${t}%;font-size:${(22+rnd()*30).toFixed(0)}px;color:${COL[Math.floor(rnd()*COL.length)]};opacity:.35;--r:${r}deg;--d:${d}s">${SY[Math.floor(rnd()*SY.length)]}</span>`;
  }
  return `<div class="cute-bg" aria-hidden="true">${out}</div>`;
}
VIEWS.lock = () => `
  ${cuteBg()}
  <div class="lock">
    <div class="tile" aria-hidden="true">∀=</div>
    <h1>Class 12</h1>
    <p class="sub">Symbolization, identity, descriptions, and functions.</p>
    <form id="code-form" class="code-form" novalidate>
      <label for="class-code" class="hint">Enter the class code your teacher gave you</label>
      <input type="text" id="class-code" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="30" placeholder="• • • • • • •" ${codeError?'aria-invalid="true" aria-describedby="code-err"':''}>
      ${codeError?`<p class="code-err" id="code-err" role="alert">That code isn’t right. Check with your teacher and try again.</p>`:''}
      <button class="btn big" type="submit">Enter</button>
    </form>
  </div>`;
app.addEventListener('submit', ev=>{
  if(ev.target.id!=='code-form') return;
  ev.preventDefault();
  if(normCode(document.getElementById('class-code').value)===CLASS_CODE){
    unlocked=true; codeError=false; try{ localStorage.setItem('class12-unlocked','yes'); }catch(e){}
    go('home');
  } else { codeError=true; render(); document.getElementById('class-code')?.focus(); }
});
if(!unlocked) view='lock';
render();
if(!unlocked) document.getElementById('class-code')?.focus();
</script>
