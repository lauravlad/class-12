<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class 12</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,400;7..72,600&family=STIX+Two+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Same visual system as Therefore: one narrow column, levels list on home, stepwise exercises. */
:root{
  --paper:#FBF7FD; --surface:#FFFFFF; --ink:#1C2142; --muted:#5D5A80; --line:#E7DCEE;
  --accent:#3442A6; --accent-ink:#FFFFFF;
  --good:#1D7550; --good-tint:#E3F3EB; --bad:#B42318; --bad-bg:#FBE9E7;
  --soft:#F4EDF8;
  --blob1:#FFD6E7; --blob2:#E3D5FF; --blob3:#CFF5EA; --blob4:#FFEFC7; --lock-line:#F3CFE0; --lock-ring:rgba(255,182,213,.28); --lock-glow:rgba(217,58,110,.45); --lock-field:#FFF8FB;
  --mast:#262D72; --mast-ink:#FFFFFF; --mast-sym:rgba(255,255,255,.09); --mast-muted:rgba(255,255,255,.78);
  --candy:#D93A6E; --candy-ink:#FFFFFF; --candy-2:#FFE6EE;
  --p1:#0D7F73; --p1-soft:#DCF2EE; --p2:#A86400; --p2-soft:#FAEDD6; --p3:#B8365F; --p3-soft:#FAE1EA; --p4:#3442A6; --p4-soft:#E6E9F8;
  --page-sym:rgba(52,66,166,.07);
  --serif:'Literata', Georgia, 'Times New Roman', serif;
  --sans:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --logic:'STIX Two Text', 'Cambria Math', 'Times New Roman', serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11132A; --surface:#1A1D39; --ink:#E7E9F7; --muted:#A2A8C8; --line:#323759;
    --accent:#8F9CFF; --accent-ink:#11132A;
    --good:#5FCB9C; --good-tint:#16352B; --bad:#FF8F84; --bad-bg:#3A1E22;
    --soft:#232747; color-scheme: dark;
    --blob1:rgba(255,92,144,.20); --blob2:rgba(155,92,246,.22); --blob3:rgba(86,211,195,.14); --blob4:rgba(242,181,75,.12); --lock-line:#4A2C4E; --lock-ring:rgba(255,92,144,.12); --lock-glow:rgba(255,92,144,.45); --lock-field:#20183A;
    --mast:#2B327F; --mast-ink:#FFFFFF; --mast-sym:rgba(255,255,255,.08); --mast-muted:rgba(255,255,255,.75);
    --candy:#FF5C90; --candy-ink:#1A0A12; --candy-2:#3D1A28;
    --p1:#56D3C3; --p1-soft:#14322E; --p2:#F2B54B; --p2-soft:#382B12; --p3:#FF8FB3; --p3-soft:#3B1A27; --p4:#8F9CFF; --p4-soft:#232747;
    --page-sym:rgba(143,156,255,.07);
  }
}
:root[data-theme="dark"]{
  --paper:#11132A; --surface:#1A1D39; --ink:#E7E9F7; --muted:#A2A8C8; --line:#323759;
  --accent:#8F9CFF; --accent-ink:#11132A;
  --good:#5FCB9C; --good-tint:#16352B; --bad:#FF8F84; --bad-bg:#3A1E22;
  --soft:#232747; color-scheme: dark;
    --blob1:rgba(255,92,144,.20); --blob2:rgba(155,92,246,.22); --blob3:rgba(86,211,195,.14); --blob4:rgba(242,181,75,.12); --lock-line:#4A2C4E; --lock-ring:rgba(255,92,144,.12); --lock-glow:rgba(255,92,144,.45); --lock-field:#20183A;
    --mast:#2B327F; --mast-ink:#FFFFFF; --mast-sym:rgba(255,255,255,.08); --mast-muted:rgba(255,255,255,.75);
    --candy:#FF5C90; --candy-ink:#1A0A12; --candy-2:#3D1A28;
    --p1:#56D3C3; --p1-soft:#14322E; --p2:#F2B54B; --p2-soft:#382B12; --p3:#FF8FB3; --p3-soft:#3B1A27; --p4:#8F9CFF; --p4-soft:#232747;
    --page-sym:rgba(143,156,255,.07);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding-block:20px 64px;padding-left:max(18px, env(safe-area-inset-left,0px));padding-right:max(18px, env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:2.4rem;letter-spacing:-.01em}
h2{font-size:1.55rem}
h3{font-size:1.1rem}
p{margin:.4em 0}
.muted{color:var(--muted)}
.f{font-family:var(--logic);white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.back{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:700;margin-bottom:10px}

/* Home */
.hero{display:flex;align-items:center;gap:16px;margin:8px 0 6px}
.hero svg{width:84px;height:auto;flex:none}
.tagline{font-size:1.05rem;color:var(--muted);max-width:34ch}
.levels{list-style:none;margin:28px 0 0;padding:0;border-top:1px solid var(--line)}
.level{border-bottom:1px solid var(--line);padding:16px 0}
.level-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.level-num{font-family:var(--serif);color:var(--muted);font-size:.95rem;white-space:nowrap}
.topics{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
.topic{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--accent);background:var(--surface);border-radius:12px;padding:12px 14px}
.topic:hover{background:var(--soft)}
.topic small{display:block;color:var(--muted);font-size:.88rem}
.go{color:var(--accent);font-weight:700;white-space:nowrap}

/* Exercise */
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.score{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prop{font-family:var(--serif);font-size:1.4rem;line-height:1.35;margin:14px 0 6px}
.prop mark{background:var(--soft);color:var(--ink);border-bottom:2px solid var(--accent);padding:0 2px}
.formula{font-family:var(--logic);font-size:1.6rem;line-height:1.6;margin:12px 0 4px;display:flex;flex-wrap:wrap;align-items:baseline;row-gap:4px}
.formula .sp{width:.3em}
.tok{border:0;background:transparent;padding:0 2px;border-radius:5px;font-family:var(--logic);font-size:inherit;line-height:inherit}
.tok.tap{border-bottom:2px dashed var(--muted);margin:0 1px}
.tok.tap:hover{background:var(--soft)}
.tok.sel{background:var(--soft);border-bottom:2px solid var(--accent)}
.tok.right{background:var(--good-tint);border-bottom:2px solid var(--good)}
.tok.wrong{background:var(--bad-bg);border-bottom:2px solid var(--bad)}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.92rem;color:var(--muted);margin:6px 0 0}
.key b{color:var(--ink);font-family:var(--logic);font-weight:600}
.step{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.step h3{margin-bottom:4px}
.step .hint{font-size:.92rem;color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.choices.one{grid-template-columns:1fr}
.choices.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;min-width:0;overflow-wrap:anywhere}
.choice b{font-family:var(--serif);margin-right:6px}
.choice.picked{border-color:var(--accent);background:var(--soft)}
.choice.right{border-color:var(--good);background:var(--good-tint)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice .why{display:block;font-size:.88rem;color:var(--muted);margin-top:4px;font-family:var(--sans)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:6px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.builder{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:12px;font-family:var(--logic);font-size:1.3rem}
.builder select{font-family:var(--logic);font-size:1.15rem;padding:6px 6px;min-width:0}
select{font:inherit;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.preview{margin-top:10px;font-size:.92rem;color:var(--muted)}
.preview .f{color:var(--ink);font-size:1.25rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:.97rem}
.fb.good{background:var(--good-tint);color:var(--ink);border-left:4px solid var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--ink);border-left:4px solid var(--bad)}
.fb strong{display:block;margin-bottom:2px}
.fb ul{margin:6px 0 0;padding-left:1.2em}
.fb li{margin:3px 0}
.next{margin-top:30px;display:flex;justify-content:flex-end}
/* Front screens */
.syms{position:absolute;inset:0;overflow:hidden;pointer-events:none;font-family:var(--logic);user-select:none}
.syms span{position:absolute;line-height:1;transform:rotate(var(--r))}
.page-syms{position:fixed;z-index:0;color:var(--page-sym)}
.lock{position:relative;z-index:1;max-width:400px;margin:9vh auto 0;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 24px 26px;box-shadow:0 18px 50px -24px rgba(28,33,66,.35)}
.lock .tile{width:76px;height:76px;margin-top:-68px;border-radius:20px;background:var(--mast);color:var(--mast-ink);display:grid;place-items:center;font-family:var(--logic);font-size:34px;box-shadow:0 10px 24px -10px rgba(38,45,114,.6)}
.lock h1{font-size:2.5rem;margin-top:6px}
.lock .sub{color:var(--muted);margin:0}
.lock .code-form{margin-top:10px;text-align:center}
.t-ico.small{font-size:.95rem}
.lock input[type=text]{text-align:center;font-size:1.3rem;letter-spacing:.18em;padding:14px 12px;font-family:var(--logic)}
.lock .chip{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;color:var(--candy);background:var(--candy-2);border-radius:999px;padding:4px 12px;font-weight:700}
.mast{position:relative;overflow:hidden;background:var(--mast);color:var(--mast-ink);border-radius:24px;padding:30px 24px 24px;margin-top:4px}
.mast .syms{color:var(--mast-sym)}
.mast > *:not(.syms){position:relative}
.kicker{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mast-muted);margin:0;font-weight:700}
.mast h1{font-size:clamp(2.6rem,9vw,3.6rem);letter-spacing:-.02em;margin-top:6px;color:var(--mast-ink)}
.mast h1 .f{font-size:.8em;opacity:.55;margin-left:.15em}
.mast-tag{color:var(--mast-muted);font-size:1.08rem;margin:.3em 0 0;max-width:34ch}
.mast .candy-cta{margin-top:22px}
.part-head{display:flex;align-items:center;gap:12px}
.part-badge{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--pc);color:var(--surface);font-family:var(--serif);font-weight:600;font-size:1rem}
.part-head h2{font-size:1.3rem}
.part-head .level-num{margin-left:auto}
.level{--pc:var(--p4);--pcs:var(--p4-soft)}
.level.part-1{--pc:var(--p1);--pcs:var(--p1-soft)}
.level.part-2{--pc:var(--p2);--pcs:var(--p2-soft)}
.level.part-3{--pc:var(--p3);--pcs:var(--p3-soft)}
.levels .topic{border-color:var(--line);display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;padding:12px 14px 12px 12px;transition:border-color .15s, transform .15s}
.levels .topic:hover{border-color:var(--pc);background:var(--surface);transform:translateY(-1px)}
.t-ico{width:44px;height:44px;border-radius:12px;background:var(--pcs);color:var(--pc);display:grid;place-items:center;font-family:var(--logic);font-size:1.25rem;font-weight:600}
.levels .go{color:var(--pc)}
@media (prefers-reduced-motion:reduce){ .levels .topic{transition:none} .levels .topic:hover{transform:none} }
.code-form{display:grid;gap:8px;width:100%;margin-top:8px;text-align:left}
.code-form .btn{justify-self:stretch}
.code-err{color:var(--bad);font-size:.95rem;margin:0}
input[aria-invalid="true"]{border-color:var(--bad)}
/* Candy Challenge */
.candy-cta{position:relative;overflow:hidden;display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--candy);color:var(--candy-ink);border:0;border-radius:16px;padding:18px 16px 16px;margin-top:22px;box-shadow:0 10px 24px -12px rgba(0,0,0,.45)}
.candy-cta::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.85) 0 8px,transparent 8px 16px)}
.candy-cta:hover{filter:brightness(1.06)}
.candy-cta .go-light{background:var(--candy-ink);color:var(--candy);border-radius:999px;padding:6px 14px}
.candy-cta b{font-family:var(--serif);font-size:1.25rem;display:block}
.candy-cta small{display:block;opacity:.88;font-size:.9rem}
.candy-ico{font-size:2.2rem;line-height:1}
.go-light{font-weight:700;white-space:nowrap;margin-left:auto}
.game-hero{text-align:center;display:grid;gap:6px;justify-items:center;margin-top:6px}
.game-hero p{max-width:40ch}
.big-candy{font-size:64px;line-height:1}
input[type=text]{font:inherit;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%;margin-top:8px}
input[type=text]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.big{font-size:1.1rem;padding:14px 24px}
.gbar{display:grid;gap:6px;margin-bottom:14px}
.gbar-row{display:flex;justify-content:space-between;font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px}
.dots i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.dots i.hit{background:var(--good)} .dots i.miss{background:var(--bad)} .dots i.now{background:var(--accent)}
.cheer{color:var(--good);font-weight:700;white-space:nowrap}
.win{text-align:center;background:var(--surface);border:2px solid var(--accent);border-radius:18px;padding:30px 18px;display:grid;gap:6px;justify-items:center;position:relative;z-index:6;margin-top:10px}
.win.lose{border-color:var(--line)}
.win h1{font-size:2.2rem}
.eyebrow{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.cheer-big{font-family:var(--serif);font-size:1.4rem;color:var(--good);margin:0}
.final{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.stamp{font-size:.9rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:6px}
.actions.center{justify-content:center;margin-top:18px}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.rain span{position:absolute;top:-60px;animation-name:fall;animation-timing-function:linear;animation-iteration-count:3}
@keyframes fall{to{transform:translateY(115vh) rotate(380deg)}}
.bounce{animation:bounce 1s ease-in-out infinite alternate}
@keyframes bounce{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-12px) rotate(6deg)}}
@media (prefers-reduced-motion:reduce){ .rain{display:none} .bounce{animation:none} }
@media (max-width:420px){ h1{font-size:2rem} .prop{font-size:1.25rem} .formula{font-size:1.35rem} .choices{grid-template-columns:1fr} .choices.three{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (prefers-reduced-motion:no-preference){ .fb{animation:pop .18s ease-out} @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}} }
.gclock{font-variant-numeric:tabular-nums;font-weight:700}
.gclock.low{color:var(--bad, #c0392b)}
.exnum{margin:-.4rem 0 .8rem;font-weight:600}


/* Cute home header */
.mast{background:linear-gradient(135deg,#E0457B 0%,#9B5CF6 58%,#3BAFA0 100%);box-shadow:0 20px 44px -24px rgba(155,92,246,.7)}
.mast .syms{color:rgba(255,255,255,.14)}
.mast h1 .f{opacity:.7}
.mast .candy-cta{background:var(--surface);color:var(--ink);box-shadow:0 12px 26px -14px rgba(60,20,80,.55)}
.mast .candy-cta::before{background:repeating-linear-gradient(-45deg,var(--candy) 0 8px,transparent 8px 16px);opacity:.85}
.mast .candy-cta small{color:var(--muted);opacity:1}
.mast .candy-cta b{color:var(--candy)}
.mast .candy-cta .go-light{background:linear-gradient(90deg,var(--candy),#9B5CF6);color:#fff}
.levels,.mast{position:relative;z-index:1}
/* ===== Cute front screen ===== */
.cute-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:
  radial-gradient(40vmax 40vmax at 8% 12%, var(--blob1), transparent 60%),
  radial-gradient(38vmax 38vmax at 92% 18%, var(--blob2), transparent 60%),
  radial-gradient(44vmax 44vmax at 80% 95%, var(--blob3), transparent 60%),
  radial-gradient(36vmax 36vmax at 10% 90%, var(--blob4), transparent 60%),
  var(--paper)}
.cute-bg span{position:absolute;line-height:1;font-family:var(--logic);font-weight:700;opacity:.85;transform:rotate(var(--r))}
.cute-bg .em{font-family:system-ui,'Apple Color Emoji','Segoe UI Emoji',sans-serif;opacity:1;filter:drop-shadow(0 4px 6px rgba(120,60,140,.18))}
@media (prefers-reduced-motion:no-preference){
  .cute-bg span{animation:bob var(--d) ease-in-out infinite alternate}
  @keyframes bob{from{transform:translateY(0) rotate(var(--r))}to{transform:translateY(-14px) rotate(calc(var(--r) + 8deg))}}
  .lock .tile{animation:wiggle 3.2s ease-in-out infinite}
  @keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scale(1.04)}}
}
.lock{border:2px solid var(--lock-line);border-radius:28px;box-shadow:0 22px 60px -26px var(--lock-glow),0 0 0 8px var(--lock-ring)}
.lock .tile{background:linear-gradient(135deg,var(--candy),#9B5CF6);color:#fff;border-radius:24px;box-shadow:0 12px 26px -10px var(--lock-glow);position:relative}
.lock .tile::after{content:'✦';position:absolute;top:-8px;right:-10px;font-size:20px;color:#FFC93C;text-shadow:0 1px 0 rgba(0,0,0,.08)}
.lock h1{background:linear-gradient(90deg,var(--candy),#9B5CF6 55%,var(--p1));-webkit-background-clip:text;background-clip:text;color:transparent}
.lock h1 .wave{-webkit-text-fill-color:initial;color:initial;margin-left:6px;font-size:.8em}
.lock input[type=text]{border:2px solid var(--lock-line);border-radius:16px;background:var(--lock-field)}
.lock input[type=text]:focus{border-color:var(--candy);outline:3px solid var(--lock-ring);outline-offset:0}
.lock .btn.big{border-radius:16px;background:linear-gradient(90deg,var(--candy),#9B5CF6);color:#fff;box-shadow:0 10px 20px -10px var(--lock-glow)}
.lock .chip{font-size:.9rem;padding:6px 14px;box-shadow:inset 0 0 0 1.5px var(--lock-line)}
.lock .hello{margin:0;font-weight:700;color:var(--candy);letter-spacing:.02em}
</style>
</head>
<body>
<main id="app"></main>
<script>
// ===== Helpers =====
// Seeded randomness: every student sees the exact same exercises, in the same order.
let R=Math.random;
function seeded(key){ let h=2166136261; for(const c of key){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } let x=h>>>0; return ()=>{ x=(x+0x6D2B79F5)|0; let t=Math.imul(x^x>>>15,1|x); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function withSeed(key,fn){ const old=R; R=seeded(key); try{ return fn(); } finally{ R=old; } }
const pick = a => a[Math.floor(R()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };

const VARS=['x','y','z'], CONSTS=['a','b','c','d'];
const isVar = s => ['w','x','y','z'].includes(s);
const At=(p,...args)=>({t:'atom',p,args}), Ng=a=>({t:'not',a}), Bn=(op,l,r)=>({t:'bin',op,l,r}), Qf=(q,v,a)=>({t:'q',q,v,a});

function tokens(root){
  const out=[];
  (function walk(n,top,bound){
    if(n.t==='atom'){ out.push({s:n.p,k:'pred'}); n.args.forEach(a=>out.push({s:a,k:isVar(a)?'var':'const',free:isVar(a)&&!bound.includes(a),binder:isVar(a)?bound.lastIndexOf(a):-1})); }
    else if(n.t==='not'){ out.push({s:'~',k:'op',node:n}); walk(n.a,false,bound); }
    else if(n.t==='bin'){ if(!top) out.push({s:'(',k:'p'}); walk(n.l,false,bound); out.push({s:n.op,k:'op',node:n,bin:true}); walk(n.r,false,bound); if(!top) out.push({s:')',k:'p'}); }
    else { out.push({s:`(${n.q}${n.v})`,k:'op',node:n}); walk(n.a,false,[...bound,n.v]); }
  })(root,true,[]);
  return out;
}
const str = n => tokens(n).map(t=>t.bin?` ${t.s} `:t.s).join('');
const freeCount = n => tokens(n).filter(t=>t.free).length;
function countVar(n,v){ if(n.t==='atom') return n.args.filter(a=>a===v).length; if(n.t==='not'||n.t==='q') return countVar(n.a,v); return countVar(n.l,v)+countVar(n.r,v); }
function quants(n,acc=[]){ if(n.t==='q'){acc.push(n); quants(n.a,acc);} else if(n.t==='not') quants(n.a,acc); else if(n.t==='bin'){quants(n.l,acc);quants(n.r,acc);} return acc; }
const typeOf = n => n.t==='atom'?'Atomic':n.t==='q'?'Quantified':'Truth-functional';

function genAtom(scope){
  const two=R()<0.3, p=two?pick(['R','L']):pick(['F','G','H']), args=[];
  for(let i=0;i<(two?2:1);i++){ const r=R(); if(r<0.35) args.push(pick(CONSTS.slice(0,3))); else if(scope.length&&r<0.88) args.push(pick(scope)); else args.push(pick(VARS)); }
  return At(p,...args);
}
function gen(d,scope){
  const r=R();
  if(d<=0||r<0.2) return genAtom(scope);
  if(r<0.36) return Ng(gen(d-1,scope));
  if(r<0.68) return Bn(pick(['&','∨','⊃','≡']),gen(d-1,scope),gen(d-1,scope));
  const open=VARS.filter(v=>!scope.includes(v)); if(!open.length) return genAtom(scope);
  const v=pick(open);
  for(let i=0;i<10;i++){ const body=gen(d-1,[...scope,v]); if(countVar(body,v)>0) return Qf(pick(['∀','∃']),v,body); }
  const a=genAtom([...scope,v]); a.args[0]=v; return Qf(pick(['∀','∃']),v,a);
}
// Replace occurrences of v; fn(i) gives the replacement for the i-th occurrence, or null to keep it.
function subst(n,v,fn,ctr={i:0}){
  if(n.t==='atom') return At(n.p,...n.args.map(a=>a===v?(fn(ctr.i++)??a):a));
  if(n.t==='not') return Ng(subst(n.a,v,fn,ctr));
  if(n.t==='bin') return Bn(n.op,subst(n.l,v,fn,ctr),subst(n.r,v,fn,ctr));
  if(n.v===v) return n;
  return Qf(n.q,n.v,subst(n.a,v,fn,ctr));
}

function evalRel(st,n,R){
  const L=(a,b)=>!!((R>>(a*n+b))&1), D=[...Array(n).keys()];
  const atom=(x,y)=>{ const v=st.ord==='xy'?L(x,y):L(y,x); return st.n3?!v:v; };
  const inner=x=>{ const r=st.q2==='∀'?D.every(y=>atom(x,y)):D.some(y=>atom(x,y)); return st.n2?!r:r; };
  const v=st.q1==='∀'?D.every(inner):D.some(inner);
  return st.on?!v:v;
}
function relCounter(a,b){
  for(let n=1;n<=3;n++){
    let best=null;
    for(let R=0;R<(1<<(n*n));R++){
      if(evalRel(a,n,R)!==evalRel(b,n,R)){ const pc=R.toString(2).split('1').length-1; if(!best||pc<best.pc) best={n,R,pc}; }
    }
    if(best) return best;
  }
  return null;
}

// ===== Decorative symbol layer (seeded so it stays put between renders) =====
function symLayer(n, seed, cls){
  let x=seed; const rnd=()=>((x=(x*16807)%2147483647)/2147483647);
  const G=['∀','∃','⊃','≡','~','&','∨','x','y','F','(∀x)','(∃y)'];
  let out='';
  for(let i=0;i<n;i++) out+=`<span style="left:${(rnd()*100).toFixed(1)}%;top:${(rnd()*100).toFixed(1)}%;font-size:${(18+rnd()*46).toFixed(0)}px;--r:${(rnd()*40-20).toFixed(0)}deg">${esc(G[Math.floor(rnd()*G.length)])}</span>`;
  return `<div class="syms ${cls||''}" aria-hidden="true">${out}</div>`;
}

// ===== Name the expression =====
// Class set: definite description, quantity expression, pronoun, none of these.
const NAME_PLAN=[6,4];
NEW.name = (k=-1) => {
  // Class set: 3 "what kind of expression" items, then 1 predicate-places item.
  if(k>=0){
    if(k===SET.name-1){ const [p,n]=PLACE_BANK[2]; return {mode:'place', p, n, pickd:null}; }
    return {mode:'kind', item:NAME_BANK[NAME_PLAN[k]], pickd:null};
  }
  if(R()<0.35){ const [p,n]=pick(PLACE_BANK); return {mode:'place', p, n, pickd:null}; }
  return {mode:'kind', item:pick(NAME_BANK), pickd:null};
};

// ===== Read a formula =====
// Class set: quantified with a free variable; truth-functional with a free variable; a negated sentence.
const READ_SET=()=>[
  Bn('&',Qf('∃','y',At('F','y')),At('G','x')),
  Ng(Qf('∀','x',Bn('⊃',At('F','x'),Qf('∃','y',At('R','x','y'))))),
];
NEW.read = (k=-1) => {
  if(k>=0){ const f=READ_SET()[k]; return {f, toks:tokens(f), type:null, main:null, free:new Set(), freeChecked:false, sent:null, done:false}; }
  const wantSentence=R()<0.5;
  let f;
  for(let i=0;i<400;i++){
    f=gen(3,[]); const s=str(f);
    if(s.length<5||s.length>32) continue;
    if(f.t==='atom'&&R()<0.85) continue;
    if((freeCount(f)===0)!==wantSentence) continue;
    break;
  }
  return {f, toks:tokens(f), type:null, main:null, free:new Set(), freeChecked:false, sent:null, done:false};
};
function formulaHTML(toks, mode, e){
  const mainIdx = toks.findIndex(t=>t.node===e.f);
  return `<div class="formula" aria-label="${esc(str(e.f))}">`+toks.map((t,i)=>{
    const sp=t.bin?'<span class="sp"></span>':'';
    let cls='tok', tap=false;
    if(mode==='main' && t.k==='op'){
      if(e.main===null){ cls+=' tap'; tap=true; }
      else { if(i===mainIdx) cls+=' right'; else if(i===e.main) cls+=' wrong'; }
    }
    if(mode==='free' && t.k==='var'){
      if(!e.freeChecked){ cls+=' tap'; tap=true; if(e.free.has(i)) cls+=' sel'; }
      else { if(t.free) cls+=' right'; else if(e.free.has(i)) cls+=' wrong'; }
    }
    const inner = tap ? `<button class="${cls}" data-act="${mode}" data-i="${i}" aria-pressed="${mode==='free'&&e.free.has(i)}">${esc(t.s)}</button>` : `<span class="${cls}">${esc(t.s)}</span>`;
    return sp+inner+sp;
  }).join('')+`</div>`;
}
VIEWS.read = () => {
  const e=ex, f=e.f, type=typeOf(f), toks=e.toks, mainIdx=toks.findIndex(t=>t.node===f);
  const typeBtns=['Atomic','Truth-functional','Quantified'].map(k=>{ let c='choice'; if(e.type){ if(k===type) c+=' right'; else if(k===e.type) c+=' wrong'; } return `<button class="${c}" data-type="${k}" ${e.type?'disabled':''}>${k}</button>`; }).join('');
  const mainOp = mainIdx>=0 ? toks[mainIdx].s : null;
  const typeWhy = f.t==='atom' ? ' An atomic formula is a predicate followed by its terms, with no logical operator.' : f.t==='q' ? ` Its main operator is the quantifier ${F(mainOp)}.` : ` Its main operator is the connective ${F(mainOp)}.`;
  let mainWhy='';
  if(f.t==='not') mainWhy=' The ~ at the front applies to everything after it.';
  else if(f.t==='bin') mainWhy=` Outer parentheses are dropped. ${F(f.op)} joins ${F(str(f.l))} and ${F(str(f.r))}.`;
  else if(f.t==='q') mainWhy=` The scope of ${F(mainOp)} is the whole formula.`;
  // Step 2
  let step2;
  if(f.t==='atom'){
    step2 = `<p class="hint">Tap the operator that governs the whole formula, or say there isn’t one.</p>${formulaHTML(toks,'main',e)}
      <div class="actions"><button class="btn ghost" data-act="main-none" ${e.main!==null?'disabled':''}>It has no main operator</button></div>
      ${e.main!==null?fb(e.main==='none', e.main==='none'?'Correct.':'It has no main operator.', ' Atomic formulas have no logical operators at all.'):''}`;
  } else {
    step2 = `<p class="hint">Tap the operator that governs the whole formula.</p>${formulaHTML(toks,'main',e)}
      <div class="actions"><button class="btn ghost" data-act="main-none" ${e.main!==null?'disabled':''}>It has no main operator</button></div>
      ${e.main!==null?fb(e.main===mainIdx, e.main===mainIdx?'Correct.':`The main operator is ${F(mainOp)}.`, mainWhy):''}`;
  }
  // Step 3
  const freeIdx=toks.map((t,i)=>t.free?i:-1).filter(i=>i>=0);
  const freeOk = e.freeChecked && freeIdx.length===e.free.size && freeIdx.every(i=>e.free.has(i));
  const qs=quants(f);
  const scopes = qs.length ? `<ul>${qs.map(q=>`<li>The scope of ${F('('+q.q+q.v+')')} is ${F(str(q))}.</li>`).join('')}</ul>` : ' There are no quantifiers, so every variable is free.';
  const nVars=toks.filter(t=>t.k==='var').length;
  const step3 = nVars===0
    ? `<p class="hint">This formula has no variables, so none can be free.</p>`
    : `<p class="hint">Tap every free occurrence of a variable. If none are free, just check.</p>${formulaHTML(toks,'free',e)}
      <div class="actions"><button class="btn" data-act="check-free" ${e.freeChecked?'disabled':''}>Check</button></div>
      ${e.freeChecked?fb(freeOk, freeOk?(freeIdx.length?`Correct: ${freeIdx.length} free.`:'Correct: none are free.'):(freeIdx.length?`${freeIdx.length} ${freeIdx.length===1?'occurrence is':'occurrences are'} free (in green).`:'None are free.'), ' An occurrence is bound only inside the scope of a quantifier with the same letter.'+scopes):''}`;
  // Step 4
  const isSent=freeIdx.length===0;
  const sBtns=[[true,'Yes, it’s a sentence'],[false,'No, it’s not']].map(([v,l])=>{ let c='choice'; if(e.sent!==null){ if(v===isSent) c+=' right'; else if(v===e.sent) c+=' wrong'; } return `<button class="${c}" data-sent="${v}" ${e.sent!==null?'disabled':''}>${l}</button>`; }).join('');
  return `${backHome}${head('Read a formula','read')}
  <div class="formula">${esc(str(f)).replace(/ /g,'&nbsp;')}</div>
  <section class="step"><h3>1. What type of formula is it?</h3><div class="choices three">${typeBtns}</div>
    ${e.type?fb(e.type===type, e.type===type?'Correct.':`It’s ${type.toLowerCase()}.`, typeWhy):''}</section>
  <section class="step"><h3>2. Main logical operator</h3>${step2}</section>
  <section class="step"><h3>3. Free variables</h3>${step3}</section>
  <section class="step"><h3>4. Is it a sentence?</h3><p class="hint">A sentence is a formula with no free variables.</p><div class="choices">${sBtns}</div>
    ${e.sent!==null?fb(e.sent===isSent, e.sent===isSent?'Correct.':(isSent?'It is a sentence.':'It is not a sentence.'), isSent?' No occurrence of a variable is free.':` It has ${freeIdx.length} free ${freeIdx.length===1?'occurrence':'occurrences'}.`):''}</section>
  ${nextBtn('Next formula')}`;
};

// ===== Substitution instances =====
NEW.sub = () => {
  for(let tries=0;tries<500;tries++){
    const v=pick(VARS), body=gen(2,[v]);
    const occ=countVar(body,v); if(occ<1) continue;
    const root=Qf(pick(['∀','∃']),v,body);
    if(freeCount(root)>0) continue;
    const s=str(root); if(s.length>30||s.length<6) continue;
    if(occ<2 && body.t!=='q' && R()<0.7) continue;
    const negate=R()<0.18;
    const [c1,c2]=shuffle(CONSTS).slice(0,2);
    const qs=`(${root.q}${v})`;
    const cands=[];
    const add=(node,ok,why)=>{ const st=str(node); if(!cands.some(c=>c.s===st)&&st!==s) cands.push({s:st,ok,why}); };
    add(subst(body,v,()=>c1), true, `Drop ${qs} and replace every ${v} with ${c1}.`);
    const wrongs=[];
    if(occ>=2){
      wrongs.push([subst(body,v,i=>i===0?c1:null), `Only the first ${v} was replaced. The others are left free.`]);
      wrongs.push([subst(body,v,i=>i%2?c2:c1), `Every freed ${v} must get the same constant. This one uses ${c1} and ${c2}.`]);
    }
    if(body.t==='q') wrongs.push([subst(subst(body.a,body.v,()=>c2),v,()=>c1), `This drops two quantifiers. Only the initial one goes.`]);
    wrongs.push([Qf(root.q,v,subst(body,v,()=>c1)), `The initial quantifier has to be dropped. Keeping it leaves a quantifier with no ${v} to bind.`]);
    if(R()<0.5) add(subst(body,v,()=>c2), true, `Drop ${qs} and replace every ${v} with ${c2}. Any constant works if it is used throughout.`);
    shuffle(wrongs).forEach(([n,w])=>{ if(cands.length<4) add(n,false,w); });
    if(cands.length<3) continue;
    const shown = negate ? Ng(root) : root;
    if(negate) cands.forEach(c=>{ c.ok=false; c.why = `The sentence is a negation, not a quantified sentence, so it has no substitution instances.`; });
    return {root:shown, negate, cands:shuffle(cands), sel:new Set(), none:false, checked:false, counted:false};
  }
};
VIEWS.sub = () => {
  const e=ex;
  const okSet=e.cands.map((c,i)=>c.ok?i:-1).filter(i=>i>=0);
  const correct = e.checked && (e.negate ? (e.none && e.sel.size===0) : (!e.none && okSet.length===e.sel.size && okSet.every(i=>e.sel.has(i))));
  const items=e.cands.map((c,i)=>{
    let cls='choice';
    if(e.checked){ if(c.ok) cls+=' right'; else if(e.sel.has(i)) cls+=' wrong'; }
    else if(e.sel.has(i)) cls+=' picked';
    return `<label class="${cls} check"><input type="checkbox" id="sub-${i}" data-subsel="${i}" ${e.sel.has(i)?'checked':''} ${e.checked?'disabled':''}><span><span class="f">${esc(c.s)}</span>${e.checked?`<span class="why">${c.ok?'✓ ':'✗ '}${fmt(c.why)}</span>`:''}</span></label>`;
  }).join('');
  const noneCls = 'choice check'+(e.checked?(e.negate?' right':(e.none?' wrong':'')):(e.none?' picked':''));
  return `${backHome}${head('Substitution instances','sub')}
  <div class="formula">${esc(str(e.root)).replace(/ /g,'&nbsp;')}</div>
  <section class="step"><h3>Select every substitution instance</h3>
    <p class="hint">Drop only the initial quantifier, then replace every freed occurrence of its variable with the same constant.</p>
    <div class="choices one">${items}
      <label class="${noneCls}"><input type="checkbox" id="sub-none" data-subnone="1" ${e.none?'checked':''} ${e.checked?'disabled':''}><span>None of these is a substitution instance</span></label>
    </div>
    <div class="actions"><button class="btn" data-act="check-sub" ${e.checked?'disabled':''}>Check</button></div>
    ${e.checked?fb(correct, correct?'Correct.':'Not quite.', e.negate?' The main operator is ~. Only sentences whose main operator is a quantifier have substitution instances.':' The reason for each option is shown above.'):''}
  </section>${nextBtn('Next sentence')}`;
};

// ===== Symbolize a sentence =====
// Class set covers A, E, I, O, and 'only': Every…, No…, Some…, Not all…, Only…
const CAT_PLAN=[{tpl:3,t:3,flip:false},{tpl:8,t:5,flip:false},{tpl:11,t:4,flip:false},{tpl:13,t:7,flip:true}];
NEW.cat = (k=-1) => {
  const P=k>=0?CAT_PLAN[k]:null;
  const t=P?CAT_TERMS[P.t]:pick(CAT_TERMS), flip=P?P.flip:R()<0.5, f=flip?t.b:t.a, g=flip?t.a:t.b, tpl=P?CAT_T[P.tpl]:pick(CAT_T);
  return {t,f,g,tpl,text:tpl.say(f,g,t),form:null,b:{on:0,q:'',n1:0,p1:'',c:'',n2:0,p2:''},checked:false,counted:false,result:null};
};
const catStr = (st,e) => {
  const L=p=>p===''?'?':(p==='F'?e.f[0]:e.g[0]);
  return `${st.on?'~':''}(${st.q||'?'}x)(${st.n1?'~':''}${L(st.p1)}x ${st.c||'?'} ${st.n2?'~':''}${L(st.p2)}x)`;
};
function kindDesc(k,e){
  const [isF,isG]=KIND_OF(k), f=e.f[1], g=e.g[1], who=e.t.ud==='people'?'someone who':'something that';
  if(isF&&isG) return `${art(f)} that is ${art(g)}`;
  if(isF) return `${art(f)} that is not ${art(g)}`;
  if(isG) return `${art(g)} that is not ${art(f)}`;
  return `${who} is neither ${art(f)} nor ${art(g)}`;
}
VIEWS.cat = () => {
  const e=ex, b=e.b;
  const formBtns=['A','E','I','O','B'].map(k=>{ let c='choice'; if(e.form){ if(k===e.tpl.form) c+=' right'; else if(k===e.form) c+=' wrong'; } return `<button class="${c}" data-form="${k}" ${e.form?'disabled':''}>${FORM_LABEL[k]}</button>`; }).join('');
  const formFb = e.form ? fb(e.form===e.tpl.form, e.form===e.tpl.form?'Correct.':`It’s ${e.tpl.form==='B'?'an “all and only” sentence':'an '+e.tpl.form+'-sentence'}.`, ' '+(e.tpl.only?`‘Only Fs are G’ means ‘All Gs are F’. It’s an A-sentence with the term after ‘only’ in the consequent.`:FORM_WHY[e.tpl.form])) : '';
  const sel=(name,opts,val)=>`<select id="cat-${name}" data-b="${name}" aria-label="${name}" ${e.result?.ok?'disabled':''}>${opts.map(([v,l])=>`<option value="${v}" ${String(v)===String(val)?'selected':''}>${l}</option>`).join('')}</select>`;
  const neg=(n)=>sel(n,[[0,'–'],[1,'~']],b[n]);
  const pred=(n)=>sel(n,[['','?'],['F',e.f[0]],['G',e.g[0]]],b[n]);
  const ready=b.q&&b.p1&&b.c&&b.p2;
  const builder=`<div class="builder">${neg('on')}<span>(</span>${sel('q',[['','?'],['∀','∀'],['∃','∃']],b.q)}<span>x)(</span>${neg('n1')}${pred('p1')}<span>x</span>${sel('c',[['','?'],['⊃','⊃'],['&','&'],['∨','∨'],['≡','≡']],b.c)}${neg('n2')}${pred('p2')}<span>x)</span></div>
    <p class="preview">Your formula: <span class="f">${esc(catStr(b,e))}</span></p>`;
  let res='';
  if(e.result){
    const r=e.result;
    if(r.ok) res=fb(true,'Correct.', r.same?'':` That’s equivalent to the standard form ${F(catStr(e.tpl.st,e))}.`);
    else {
      let hint='';
      if(b.q==='∀'&&b.c==='&') hint=` ∀ with & says everything in the UD is ${art(b.p1==='F'?e.f[1]:e.g[1])}. Universal forms pair with ⊃.`;
      else if(b.q==='∃'&&b.c==='⊃') hint=` ∃ with ⊃ is true as soon as anything fails the antecedent. Existential forms pair with &.`;
      else if(e.tpl.only&&b.q==='∀'&&b.c==='⊃'&&b.p1==='F'&&b.p2==='G'&&!b.n1&&!b.n2&&!b.on) hint=` ‘Only’ reverses the direction. The term after ‘only’ goes in the consequent.`;
      const m=r.counter;
      const ce=` Suppose the UD contains only ${m.kinds.map(k=>kindDesc(k,e)).join(' and ')}. Then the English sentence is ${m.eng?'true':'false'}, but your formula is ${m.mine?'true':'false'}.`;
      res=fb(false,'Not quite.', hint+ce+' Change the formula and check again.');
    }
  }
  return `${backHome}${head('Symbolize a sentence','cat')}
  <p class="prop">${esc(e.text)}</p>
  <div class="key"><span>UD: ${esc(e.t.ud)}</span><span><b>${e.f[0]}x</b>: x is ${art(e.f[1])}</span><span><b>${e.g[0]}x</b>: x is ${art(e.g[1])}</span></div>
  <section class="step"><h3>1. Which form is it?</h3><div class="choices">${formBtns}</div>${formFb}</section>
  <section class="step"><h3>2. Build the formula</h3><p class="hint">Pick each part. Any equivalent formula counts as correct.</p>${builder}
    <div class="actions"><button class="btn" data-act="check-cat" ${!ready||e.result?.ok?'disabled':''}>Check</button></div>${res}</section>
  ${nextBtn('Next sentence')}`;
};

// ===== Part 4: Quantifier order =====
// Class set: everyone/someone, someone/everyone, someone whom everyone…, no one… everyone.
const ORDER_PLAN=[[0,0],[1,1],[2,2],[6,3]];

// ===== Part 4: Move a quantifier =====
// Class set: consequent (keeps its type), antecedent (flips), biconditional (can't move).
const MOVE_PLAN=[['cons','∀'],['ante','∃'],['bic','∃']];
NEW.move = (k=-1) => {
  const [P,G]=shuffle(['F','G','H']).slice(0,2), c=pick(CONSTS.slice(0,3));
  const q=k>=0?MOVE_PLAN[k][1]:pick(['∀','∃']);
  const pos=k>=0?MOVE_PLAN[k][0]:pick(['andL','andR','or','cons','ante','ante','bic']);
  const side=`${P}${c}`, qp=`(${q}x)${G}x`, flip=q==='∀'?'∃':'∀';
  const M={
    andL:{s:`${side} & ${qp}`, ans:q, res:`(${q}x)(${side} & ${G}x)`, why:`${side} has no x, so the quantifier can move over & and keeps its type.`},
    andR:{s:`${qp} & ${side}`, ans:q, res:`(${q}x)(${G}x & ${side})`, why:`${side} has no x, so the quantifier can move over & and keeps its type.`},
    or:{s:`${side} ∨ ${qp}`, ans:q, res:`(${q}x)(${side} ∨ ${G}x)`, why:`A quantifier joined by ∨ to a formula with no x keeps its type when it moves.`},
    cons:{s:`${side} ⊃ ${qp}`, ans:q, res:`(${q}x)(${side} ⊃ ${G}x)`, why:`The quantifier is in the consequent, so it keeps its type.`},
    ante:{s:`${qp} ⊃ ${side}`, ans:flip, res:`(${flip}x)(${G}x ⊃ ${side})`, why:q==='∃'?`The quantifier is in the antecedent, so it flips: ∃ becomes ∀. Compare ‘If anyone sings, Ana sings’: it means ‘Everyone is such that if they sing, Ana sings.’`:`The quantifier is in the antecedent, so it flips: ∀ becomes ∃. You can see why from the equivalent ~${qp} ∨ ${side}.`},
    bic:{s:`${qp} ≡ ${side}`, ans:'none', res:null, why:`A quantifier on one side of ≡ can’t, in general, be broadened over the whole biconditional. Neither (∀x) nor (∃x) gives an equivalent sentence.`},
  }[pos];
  return {...M, pickd:null};
};
VIEWS.move = () => {

};

    else out+=`<span style="left:${l}%;top:${t}%;font-size:${(22+rnd()*30).toFixed(0)}px;color:${COL[Math.floor(rnd()*COL.length)]};opacity:.35;--r:${r}deg;--d:${d}s">${SY[Math.floor(rnd()*SY.length)]}</span>`;
  }
  return `<div class="cute-bg" aria-hidden="true">${out}</div>`;
}
VIEWS.lock = () => `
  ${cuteBg()}
  <div class="lock">
    <div class="tile" aria-hidden="true">∀∃</div>
    <p class="hello">Hi, logician! 👋</p>
    <h1>Class 12<span class="wave" aria-hidden="true">🍭</span></h1>
    <p class="sub">Predicate logic review for PHIL 270: all four parts.</p>
    <form id="code-form" class="code-form" novalidate>
      <label for="class-code" class="hint">Enter the class code your teacher gave you</label>
      <input type="text" id="class-code" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="30" placeholder="• • • • • • •" ${codeError?'aria-invalid="true" aria-describedby="code-err"':''}>
      ${codeError?`<p class="code-err" id="code-err" role="alert">That code isn’t right. Check with your teacher and try again.</p>`:''}
      <button class="btn big" type="submit">Enter</button>
    </form>
    <span class="chip"><span aria-hidden="true">🍬</span> Candy Challenge inside</span>
  </div>`;
app.addEventListener('submit', ev=>{
  if(ev.target.id!=='code-form') return;
  ev.preventDefault();
  if(normCode(document.getElementById('class-code').value)===CLASS_CODE){
    unlocked=true; codeError=false; try{ localStorage.setItem('class12-unlocked','yes'); }catch(e){}
    go('home');
  } else { codeError=true; render(); document.getElementById('class-code')?.focus(); }
});
if(!unlocked) view='lock';
render();
if(!unlocked) document.getElementById('class-code')?.focus();
</script>
